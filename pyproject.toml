[project]
name = "crossplane-function-pythonic"
version = "0.0.0"
description = "A Python centric Crossplane Function"
license = "Apache-2.0"
readme = "README.md"
authors = [
  { name = "Patrick J McNerthney", email = "pat@mcnerthney.com" }
]
requires-python = ">=3.12,<3.16"
dependencies = [
  "grpcio==1.85.0",
  "inflect==7.6.0",
  "kr8s==0.20.15",
  "protobuf==7.36.2",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
packages = ["kopf==1.45.2"]
pip-install = ["pip==26.2.2"]

[project.urls]
Documentation = "https://github.com/crossplane-contrib/function-pythonic#readme"
Issues = "https://github.com/crossplane-contrib/function-pythonic/issues"
Source = "https://github.com/crossplane-contrib/function-pythonic"

[project.scripts]
function-pythonic = "crossplane.pythonic.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.uv.build-backend]
module-name = "crossplane.pythonic"

[tool.poe.tasks]
generate-protoc = "python -m grpc_tools.protoc --proto_path=src --python_out=src --pyi_out=src --grpc_python_out=src crossplane/pythonic/proto/v1/run_function.proto"
test = "pytest tests -x --verbose --verbose --cov --cov-report=term --cov-report=html:reports"
test-protobuf = "pytest tests/test_protobuf_*.py -x --verbose --verbose --cov --cov-report=term --cov-report=html:reports"
test-ci = "pytest tests --verbose --verbose --junitxml=reports/pytest-junit.xml --cov --cov-report=term --cov-report=xml:reports/pytest-coverage.xml"

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:kr8s._vendored.asyncache",
]
